<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts</title>
    <link rel="stylesheet" href="fonts.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
</head>
<body>
    <header>
        <h1>Fonts</h1>
    </header>    

    <div class="main">
        <div class="welcometext">
                  <h3>Create your own font</h3>
                  <h5>using ur own hands</h5>
                  <p>or feet 😳</p>
        </div> 

        <div class="drawboard">
            <canvas id="canvas"></canvas>
            <div class="buttons">
                <button id="back">previous letter</button>
                <button id="clear">Clear</button>
                <button id="skip">Skip</button>
                <button id="confirm">Confirm</button>
            </div>

            <div class="emptywarning">
                <p id="emptywarning" style="color: rgb(182, 53, 79); display: none;">Please write something first , or press skip u so lazy eh</p>
            </div>
        </div>
        <div class="drawboard" id="doneBoard" style="display:none">
            <textarea id="previewArea">Try ur font...</textarea>
            <button id="download">Download ur shenanigans..i mean font</button>
        </div>
        

    </div>






<script src="fonts.js"></script>
</body>
